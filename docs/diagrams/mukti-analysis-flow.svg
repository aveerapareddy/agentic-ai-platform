  <rect class="box" x="480" y="60" width="180" height="56" rx="4"/><text class="t" x="500" y="92">execution_feedback</text>
  <rect class="box" x="260" y="160" width="200" height="56" rx="4"/><text class="t" x="300" y="192">mukti-agent</text>
  <rect class="box" x="520" y="160" width="220" height="56" rx="4"/><text class="t" x="540" y="192">Ranked suggestions</text>
