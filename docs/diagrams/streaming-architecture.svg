<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #141518; }
      .box { fill: #1e1f24; stroke: #34363e; }
      .t { fill: #ececef; font-size: 12px; }
      .ts { fill: #8b8d96; font-size: 11px; }
      .arr { stroke: #5b8def; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5b8def"/></marker>
  </defs>
  <rect class="bg" width="900" height="360"/>
  <text class="t" x="24" y="28" font-size="16" font-weight="600">Execution streaming (observational)</text>
  <rect class="box" x="40" y="70" width="200" height="64" rx="4"/>
  <text class="t" x="72" y="98">orchestrator</text>
  <text class="ts" x="56" y="118">persists execution state</text>
  <rect class="box" x="300" y="70" width="220" height="64" rx="4"/>
  <text class="t" x="328" y="98">api-gateway</text>
  <text class="ts" x="312" y="118">poll repository ’ SSE diff</text>
  <rect class="box" x="580" y="70" width="240" height="64" rx="4"/>
  <text class="t" x="608" y="98">operator-console</text>
  <text class="ts" x="596" y="118">fetch + SSE parse (auth headers)</text>
  <line class="arr" x1="240" y1="102" x2="300" y2="102"/>
  <text class="ts" x="248" y="92">read snapshot</text>
  <line class="arr" x1="520" y1="102" x2="580" y2="102"/>
  <text class="ts" x="528" y="92">text/event-stream</text>
  <rect class="box" x="120" y="180" width="660" height="120" rx="4"/>
  <text class="t" x="136" y="208">Event types (bounded)</text>
  <text class="ts" x="136" y="228">execution_updated · step_updated · trace_event · approval_required</text>
  <text class="ts" x="136" y="246">execution_completed · execution_failed · heartbeat</text>
  <text class="ts" x="136" y="272">UI does not drive lifecycle  orchestrator remains source of truth</text>
</svg>
