server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api-gateway:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /metrics {
        proxy_pass http://api-gateway:8080/metrics;
    }

    location /health/ {
        proxy_pass http://api-gateway:8080/health/;
    }
}
